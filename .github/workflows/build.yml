name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: yarn install --frozen-lockfile

      - name: Build dev bundle
        run: yarn electron:build

      - name: Build linux packages
        if: startsWith(github.ref, 'refs/tags/')
        run: yarn electron-builder --linux deb rpm AppImage

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Photobooth-linux-x64-release
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: yarn install --frozen-lockfile

      - name: Build dev bundle
        shell: bash
        run: yarn electron:build

      - name: Build windows installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: yarn electron-builder --win nsis

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Photobooth-win-x64-release
          path: dist/*.exe
          retention-days: 5

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Photobooth-linux-x64-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: Photobooth-win-x64-release
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
