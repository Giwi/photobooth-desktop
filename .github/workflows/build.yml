name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Prepare build dir
        run: |
          mv build/dev-linux-x64/Photobooth-dev Photobooth-linux-x64

      - name: Archive tar.gz
        run: tar czf Photobooth-linux-x64.tar.gz Photobooth-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Photobooth-linux-x64
          path: Photobooth-linux-x64.tar.gz
          retention-days: 5

      - name: Install fpm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm

      - name: Build .deb
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p pkg/usr/lib/photobooth pkg/usr/share/applications
          cp -r Photobooth-linux-x64/* pkg/usr/lib/photobooth/
          cat > pkg/usr/share/applications/photobooth.desktop <<EOF
          [Desktop Entry]
          Name=Photobooth
          Comment=Webcam photobooth with background overlays
          Exec=/usr/lib/photobooth/launcher
          Icon=/usr/lib/photobooth/icon.svg
          Terminal=false
          Type=Application
          Categories=Graphics;Photography;
          EOF
          fpm -s dir -t deb -n photobooth -v "$VERSION" \
            -m "GiwiSoft" \
            --license MIT \
            --description "Webcam photobooth desktop app" \
            -C pkg .

      - name: Build .rpm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          fpm -s dir -t rpm -n photobooth -v "$VERSION" \
            -m "GiwiSoft" \
            --license MIT \
            --description "Webcam photobooth desktop app" \
            -C pkg .

      - name: Upload .deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-${{ github.ref_name }}.deb
          path: photobooth_*.deb
          retention-days: 5

      - name: Upload .rpm
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: photobooth-${{ github.ref_name }}.rpm
          path: photobooth*.rpm
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Prepare exe
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path build -Recurse -Directory | Where-Object { $_.Name -eq "Photobooth" -or $_.Name -eq "Photobooth-dev" } | Select-Object -First 1
          if ($buildDir) {
            Move-Item $buildDir.FullName Photobooth-win-x64
            Compress-Archive -Path Photobooth-win-x64/* -DestinationPath Photobooth-win-x64.zip
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Photobooth-win-x64
          path: Photobooth-win-x64.zip
          retention-days: 5

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Photobooth-linux-x64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: photobooth-${{ github.ref_name }}.deb
          path: release
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: photobooth-${{ github.ref_name }}.rpm
          path: release
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: Photobooth-win-x64
          path: release
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
