name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run build

      - name: Archive build
        run: |
          mv build/dev-linux-x64/Photobooth-dev Photobooth-linux-x64
          tar czf Photobooth-linux-x64.tar.gz Photobooth-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Photobooth-linux-x64
          path: Photobooth-linux-x64.tar.gz
