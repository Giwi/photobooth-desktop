<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photobooth</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #101014 url("./splash.png") center / cover no-repeat;
      font-family: system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      box-sizing: border-box;
    }
    .bg-name {
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      opacity: 0.9;
      min-height: 20px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="bg-name" id="bgName"></div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <script>
    const bgNameEl = document.getElementById('bgName');
    const progressFillEl = document.getElementById('progressFill');
    
    window.electronAPI.onBgProgress((data) => {
      bgNameEl.textContent = data.name;
      progressFillEl.style.width = `${data.progress}%`;
      if (data.name === "Done") {
        progressFillEl.style.background = "#4caf50";
        bgNameEl.style.fontWeight = "bold";
      }
    });
  </script>
</body>
</html>
