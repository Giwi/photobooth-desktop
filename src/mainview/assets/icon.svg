<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="lensShine" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Camera body -->
  <g transform="translate(64,84)">
    <rect x="24" y="64" width="272" height="234" rx="34" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="24" y="64" width="272" height="234" rx="34" fill="#1e293b" filter="url(#shadow)"/>

    <!-- Viewfinder -->
    <rect x="12" y="40" width="72" height="24" rx="12" fill="#334155"/>

    <!-- Lens outer -->
    <circle cx="160" cy="181" r="72" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Lens ring -->
    <circle cx="160" cy="181" r="60" fill="#1e293b" stroke="url(#accent)" stroke-width="5"/>
    <!-- Lens inner -->
    <circle cx="160" cy="181" r="44" fill="url(#lens)"/>
    <!-- Lens pupil -->
    <circle cx="160" cy="181" r="20" fill="#0f172a"/>
    <!-- Lens reflection -->
    <circle cx="160" cy="181" r="42" fill="url(#lensShine)"/>
    <ellipse cx="145" cy="165" rx="10" ry="6" fill="#fff" opacity="0.25" transform="rotate(-30 145 165)"/>

    <!-- Flash -->
    <circle cx="264" cy="100" r="14" fill="#fbbf24" opacity="0.9"/>
    <circle cx="264" cy="100" r="8" fill="#fef3c7"/>

    <!-- Grip lines -->
    <rect x="292" y="130" width="10" height="100" rx="5" fill="#334155"/>
    <rect x="292" y="140" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="152" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="164" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="176" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="188" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="200" width="10" height="4" rx="2" fill="#475569"/>
    <rect x="292" y="212" width="10" height="4" rx="2" fill="#475569"/>
  </g>
</svg>
